[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paha-fcil"
version = "1.0.0"
description = "Participation-aware historical aggregation for federated class-incremental learning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "Pillow>=9.0",
]

[project.scripts]
paha = "paha_fc.cli:main"

[tool.setuptools.packages.find]
include = ["paha_fc*"]
